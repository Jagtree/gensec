# ================================================================
#  GenSec v0.3.0 — Wall panel 1870x300 (rotated, y-oriented)
# ================================================================
#
#  Companion of ``Pannello_30x187.yaml`` with width and height
#  swapped.  Demand moments and rebar layout are rotated accordingly
#  (note the sign of ``My_kNm``).  Useful as a regression check on
#  the symmetry of the verification under 90° rotation.
# ================================================================

materials:
  concrete_direct:
    type: concrete_ec2_gen1
    class: C50/60

  B450C:
    type: steel
    fyk: 450.0
    gamma_s: 1.15
    k_hardening: 1.15     # ft/fy ratio; 1.0 = perfectly plastic (default 1.0)
    eps_su: 0.075         # ultimate strain (default 0.01)
    works_in_compression: true
    Es: 200000.0          # Young's modulus [MPa] (default 200000)

section:
  B: 1870
  H: 300
  bulk_material: concrete_direct
  n_fibers_y: 60
  n_fibers_x: 30
  rebars:
    - {y: 50,  x: 50,   material: B450C, n_bars: 1, diameter: 26}
    - {y: 50,  x: 150,  material: B450C, n_bars: 1, diameter: 26}
    - {y: 50,  x: 1160, material: B450C, n_bars: 1, diameter: 20}
    - {y: 50,  x: 1720, material: B450C, n_bars: 1, diameter: 20}
    - {y: 50,  x: 1820, material: B450C, n_bars: 1, diameter: 20}
    - {y: 150, x: 50,   material: B450C, n_bars: 1, diameter: 26}
    - {y: 250, x: 50,   material: B450C, n_bars: 1, diameter: 26}
    - {y: 250, x: 150,  material: B450C, n_bars: 1, diameter: 26}
    - {y: 250, x: 1160, material: B450C, n_bars: 1, diameter: 20}
    - {y: 250, x: 1720, material: B450C, n_bars: 1, diameter: 20}
    - {y: 250, x: 1820, material: B450C, n_bars: 1, diameter: 20}

demands:
  - name: 1
    N_kN: 0
    Mx_kNm: 207.93
    My_kNm: -240.79

output:

  # ── Utilization ratio flags (v0.3.0) ──
  eta_norm: true               # default: true  — principal 3-D linear-distance metric
  eta_norm_beta: true          # default: true  — composite ratio (cross-software comparison)
  eta_norm_ray: true           # default: false — proportional load amplification
  eta_2D: true                 # default: false — Mx-My ray at fixed N (biaxial only)
  eta_path_norm_ray: false     # default: false — staged 3-D ray
  eta_path_norm_beta: false    # default: false — staged composite ratio
  eta_path_2D: false           # default: false — staged Mx-My ray
  delta_N_tol: 0.001           # tightened tolerance: demand at N = 0 (pure flexure)

  # ── Domain generation ──
  generate_mx_my: true
  generate_3d_surface: true
  #n_angles_mx_my: 360

  # ── Moment-curvature and ductility ──
  generate_moment_curvature: true
  generate_polar_ductility: false
  generate_3d_moment_curvature: false

  # ── N-level strategy ──
  n_levels_mode: demands
  # n_levels_count: 10
  # n_levels_values: [-3000, -1500, 0]
