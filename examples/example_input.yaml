# ================================================================
#  GenSec v0.3.0 — basic rectangular RC section with envelopes
# ================================================================
#
#  Legacy rectangular section (B + H + n_fibers_y) with two named
#  load envelopes.  Each envelope reports eta_max across its inline
#  member list.
# ================================================================

materials:
  concrete_1:
    type: concrete_ec2_gen1_custom
    fck: 25.0
    gamma_c: 1.5
    alpha_cc: 0.85

  steel_1:
    type: steel
    fyk: 450.0
    gamma_s: 1.15
    works_in_compression: true

section:
  B: 300
  H: 600
  bulk_material: concrete_1
  n_fibers_y: 50
  rebars:
    - {y: 40,  As: 942.5, material: steel_1, n_bars: 3, diameter: 20}
    - {y: 300, As: 402.1, material: steel_1, n_bars: 2, diameter: 16}
    - {y: 560, As: 942.5, material: steel_1, n_bars: 3, diameter: 20}

demands:
  - name: Gravity
    N_kN: -1500
    Mx_kNm: 200
    My_kNm: 0
  - name: Seismic_X
    N_kN: -1200
    Mx_kNm: 280
    My_kNm: 0

envelopes:
  - name: Seismic_X_envelope
    members:
      - {N_kN: -1800, Mx_kNm: 180, My_kNm: 30}
      - {N_kN: -1500, Mx_kNm: 250, My_kNm: 45}
      - {N_kN: -1200, Mx_kNm: 300, My_kNm: 20}
      - {N_kN: -900,  Mx_kNm: 280, My_kNm: 55}
      - {N_kN: -2000, Mx_kNm: 150, My_kNm: 10}
  - name: Seismic_Y_envelope
    members:
      - {N_kN: -1600, Mx_kNm: 100, My_kNm: 120}
      - {N_kN: -1400, Mx_kNm: 80,  My_kNm: 150}
      - {N_kN: -1100, Mx_kNm: 120, My_kNm: 180}

output:
  # v0.3.0 utilization flags.
  eta_norm: true               # principal 3-D linear-distance metric
  eta_norm_beta: true          # composite ratio (cross-software comparison)
  eta_2D: true                 # Mx-My ray-cast at fixed N (biaxial only)
  generate_mx_my: true
  generate_3d_surface: true
  n_angles_mx_my: 144
  generate_moment_curvature: false
  generate_polar_ductility: false
  generate_3d_moment_curvature: false
