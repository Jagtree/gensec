combinations:
  # --- SLE: stress verification ---------------------------------
  # Short-term, declared as such: moduli = Ecm per zone (NTC 2018
  # 11.2.10.3, fcm = fck + 8), no creep.  An honest lower bound on the
  # long-term redistribution, NOT a long-term verification.
  #
  # All SLE actions are permanent, so each SLE case is at the same time
  # the characteristic and the quasi-permanent combination
  # (NTC 2018 4.1.2.2.5.1).  Both limit families are therefore
  # checked, one combination each:
  #   *_car : sigma_c <= 0.60 fck (per zone), sigma_s <= 0.80 fyk
  #   *_qp  : sigma_c <= 0.45 fck (per zone)
  # The qp concrete limit governs; the car one is kept for the steel.
  - name: SLE_01_car
    components: [{ref: d_SLE_01, factor: 1.0}]
    sls: &sls_car
      moduli: &moduli_st {base: 29962.0, getto2: 33346.0}
      limits:
        kind: characteristic
        fyk: 450.0
        decompression: false
        overrides: {k1: 0.60, k3: 0.80}
  - name: SLE_01_qp
    components: [{ref: d_SLE_01, factor: 1.0}]
    sls: &sls_qp
      moduli: *moduli_st
      limits:
        kind: quasi_permanent
        decompression: false
        overrides: {k2: 0.45}
  - name: SLE_02_car
    components: [{ref: d_SLE_02, factor: 1.0}]
    sls: *sls_car
  - name: SLE_02_qp
    components: [{ref: d_SLE_02, factor: 1.0}]
    sls: *sls_qp
  - name: SLE_03_car
    components: [{ref: d_SLE_03, factor: 1.0}]
    sls: *sls_car
  - name: SLE_03_qp
    components: [{ref: d_SLE_03, factor: 1.0}]
    sls: *sls_qp
  - name: SLE_04_car
    components: [{ref: d_SLE_04, factor: 1.0}]
    sls: *sls_car
  - name: SLE_04_qp
    components: [{ref: d_SLE_04, factor: 1.0}]
    sls: *sls_qp
  - name: SLE_05_car
    components: [{ref: d_SLE_05, factor: 1.0}]
    sls: *sls_car
  - name: SLE_05_qp
    components: [{ref: d_SLE_05, factor: 1.0}]
    sls: *sls_qp
  - name: SLE_06_car
    components: [{ref: d_SLE_06, factor: 1.0}]
    sls: *sls_car
  - name: SLE_06_qp
    components: [{ref: d_SLE_06, factor: 1.0}]
    sls: *sls_qp
  - name: SLE_07_car
    components: [{ref: d_SLE_07, factor: 1.0}]
    sls: *sls_car
  - name: SLE_07_qp
    components: [{ref: d_SLE_07, factor: 1.0}]
    sls: *sls_qp
  - name: SLE_08_car
    components: [{ref: d_SLE_08, factor: 1.0}]
