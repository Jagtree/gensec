#  positive, so N is negated.  Mx, My copied with the sheet sign:
#  GenSec Mx > 0 compresses the BOTTOM edge, My > 0 the LEFT edge
#  (see sign_conventions).  SLV is sign-symmetric in Mx and My; SLE
#  is not (Mx >= 0 only) -> sheet convention to be confirmed.
# ----------------------------------------------------------------------
