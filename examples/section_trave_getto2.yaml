# ======================================================================
#  GenSec input -- circular RC member with second-phase casting
#  Revision 2: symmetric geometry, class fck, NTC 2018 Es, demands.
# ======================================================================
#
#  Source : Excel sheet (Trave / Getto2aFase / Foro / Armature
#           ordinarie / Sollecitazioni SLE / Sollecitazioni SLV).
#  Units  : mm, MPa, kN, kN*m.
#
#  Frame
#  -----
#  All coordinates are the Excel ones shifted by
#      (x, y) = (x_xls + 5211.755, y_xls + 5211.75)
#  so that the bounding box starts at the origin (GenSec convention).
#  The symmetry axis is x = 5211.755.  Each bar carries its Excel-frame
#  position in a trailing comment.  Moments are taken by GenSec about
#  the gross-polygon centroid: in the Excel frame (0, 101.84) mm for
#  concrete only.  If the sheet moments refer to another point (e.g.
#  the homogenised centroid, about y = 73.5 mm with n = 15, or the
#  origin) they must be transported: dMx = N * dy.
#
#  Zones
#  -----
#  zone 0 "base"   : beam "Trave", C20/25 (exterior - hole - zone 1).
#  zone 1 "getto2" : second-phase casting "Getto2aFase", C32/40.
#  hole            : "Foro", R = 3500 mm, 32-gon (void).
#  No construction_history, deliberately: both bulk zones are taken as
#  active from the same instant and carry every demand from zero.
#  All SLE demands are treated as permanent.  Short-term analysis:
#  no creep, no shrinkage (see the SLE block in `combinations`).
#
#  Geometry corrections (ratified, rev. 2)
#  --------------------------------------
#  * Polygons and ring-2 bars mirrored exactly about the axis (sheet
#    asymmetries <= 0.02 mm).
#  * Inner ring R3560: 111 bars rotated by 90 deg (a bar on the axis at
#    90 deg).  With an odd count the sheet layout (bar at 0 deg) was
#    symmetric about x, not about the vertical axis.
#  * Outer ring R4140: 99 bars, 135 deg -> 45 deg (mirror of bar 112
#    added; the two coincident bars removed).
#  * Diagonal rows: parallel to the face, cover 60 mm (tangent line of
#    R4140 at 45 deg), from the 45 deg bar to the corner bar
#    (+-1064.85, 4790); 12 bars per side.
#  * Top row: y = 4790 (cover 60 mm to the free top face), 10 bars
#    between the corner bars at 193.6 mm (the two touching bars at
#    x = +-10 replaced by a regular row).
#  * Ear apices: bars 246/395 moved from the free face onto the
#    bisector, 60 mm from both faces: (-+1797.165, 5472.21).
#  Total 395 x D20 (sheet: 396 listed, 394 distinct).
#
#  Declared here, absent from the sheet -- to be ratified
#  ------------------------------------------------------
#  gamma_c, long_term_reduction_factor, n_parabola, eps_c2, eps_cu2,
#  fct, k_hardening, eps_su, works_in_compression.
#
#  Verification layout (rev. 3)
#  ----------------------------
#  SLV_xx (demands)      : resistance-domain check only, once each.
#  SLE_xx_car / SLE_xx_qp (combinations): SLS stress checks (sls
#  block).  They reference the d_SLE_xx demands, and every demand is
#  also checked on
#  the resistance domain: those 10 eta values are NOT meaningful and
#  are to be ignored.  The current schema has no way to declare a
#  combination's limit state nor to keep a demand out of the domain
#  check.
# ======================================================================

schema_version: 1
code: ntc18

materials:

  c_trave:                       # C20/25
    type: concrete
    fck: 20.0                    # [MPa] class value
    gamma_c: 1.5                 # [-]
    long_term_reduction_factor: 0.85   # alpha_cc [-]
    n_parabola: 2.0
    eps_c2: -0.0020
    eps_cu2: -0.0035
    fct: 0.0                     # no tension branch
    Ec: 29962.0                  # [MPa] 22000 (fcm/10)^0.3, fcm = fck + 8

  c_getto2:                      # C32/40
    type: concrete
    fck: 32.0                    # [MPa] class value
    gamma_c: 1.5
    long_term_reduction_factor: 0.85
    n_parabola: 2.0
    eps_c2: -0.0020
    eps_cu2: -0.0035
    fct: 0.0
    Ec: 33346.0                  # [MPa] 22000 (fcm/10)^0.3

  steel_B450C:
    type: steel
    fyk: 450.0                   # [MPa]
    gamma_s: 1.15                # fyd = 391.3 MPa
    Es: 210000.0                 # [MPa] NTC 2018 11.3.4.x
    k_hardening: 1.0             # elastic - perfectly plastic
    eps_su: 0.0675               # 0.9 * eps_uk, eps_uk = 7.5 %
    works_in_compression: true

