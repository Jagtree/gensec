# ================================================================
#  GenSec v0.3.0 — biaxial column with envelope
# ================================================================
#
#  400x600 RC column with mixed rebar diameters and one named
#  envelope over six inline demand triples.
# ================================================================

# The model's normative declaration. GenSec derives nothing without
# it: f_ck is an input, the code is what turns it into a modulus, and
# the two disagree by 33.9 % at C25. Declared once here; a material
# may override it with its own 'code:', and 'code: custom' means the
# input supplies every code-dependent value itself.
code: ec2

materials:
  C30:
    type: concrete_ec2_gen1
    class: C30/37
    ls: F
    loadtype: slow
    TypeConc: R

    NA: "French"
    time: 28
  B450C:
    type: steel
    fyk: 450.0
    gamma_s: 1.15
    works_in_compression: true

section:
  B: 400
  H: 600
  bulk_material: C30
  n_fibers_y: 40
  n_fibers_x: 20
  rebars:
    - {y: 45,  x: 45,  As: 314.16, material: B450C, n_bars: 1, diameter: 20}
    - {y: 45,  x: 355, As: 314.16, material: B450C, n_bars: 1, diameter: 20}
    - {y: 555, x: 45,  As: 314.16, material: B450C, n_bars: 1, diameter: 20}
    - {y: 555, x: 355, As: 314.16, material: B450C, n_bars: 1, diameter: 20}
    - {y: 45,  x: 200, As: 201.06, material: B450C, n_bars: 1, diameter: 16}
    - {y: 555, x: 200, As: 201.06, material: B450C, n_bars: 1, diameter: 16}
    - {y: 300, x: 45,  As: 201.06, material: B450C, n_bars: 1, diameter: 16}
    - {y: 300, x: 355, As: 201.06, material: B450C, n_bars: 1, diameter: 16}

demands:
  - name: Gravity
    N_kN: -2000
    Mx_kNm: 150
    My_kNm: 0
  - name: Seismic_biax
    N_kN: -1500
    Mx_kNm: 200
    My_kNm: 100

envelopes:
  - name: Envelope_SLU
    members:
      - {N_kN: -2500, Mx_kNm: 100, My_kNm: 50}
      - {N_kN: -2000, Mx_kNm: 200, My_kNm: 80}
      - {N_kN: -1500, Mx_kNm: 250, My_kNm: 120}
      - {N_kN: -1000, Mx_kNm: 200, My_kNm: 150}
      - {N_kN:  -800, Mx_kNm: 150, My_kNm: 100}
      - {N_kN: -1800, Mx_kNm: 180, My_kNm: 60}

output:
  # v0.3.0 utilization flags.
  eta_norm: true               # principal 3-D linear-distance metric
  eta_norm_beta: true          # composite ratio (cross-software comparison)
  eta_2D: true                 # Mx-My ray at fixed N (biaxial only)
  generate_mx_my: true
  generate_3d_surface: true
  n_angles_mx_my: 144
  generate_moment_curvature: true
  generate_polar_ductility: true
  generate_3d_moment_curvature: true
