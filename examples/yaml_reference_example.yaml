# ================================================================
#  COMBINATIONS  (v2.1)
# ================================================================
#  A combination has EITHER ``components`` (simple factored sum)
#  OR ``stages`` (sequential accumulation) -- never both.
#
#  The keys ``prestress_actions``, ``section_ops``, ``time`` and
#  ``report`` are STAGE-ONLY: placing them on a simple combination
#  or at the staged-combination level raises.

combinations:

  # ----------------------------------------------------------------
  # (1) Simple: flat factored sum  S = sum f_i * d_i
  # ----------------------------------------------------------------
  - name: SLU_1
    components:
      - {ref: G,  factor: 1.3}     # factor defaults to 1.0
      - {ref: Q1, factor: 1.5}

  # ----------------------------------------------------------------
  # (2) Staged, capacity-frozen (no section_ops anywhere):
  #     classic seismic-on-the-in-service-section.  Demand
  #     accumulates; ONE fixed resistance domain.  Path metrics
  #     (eta_path_*) measure each stage segment B->T.
  # ----------------------------------------------------------------
  - name: SLU_sismico_Ex
    stages:
      - name: gravitazionale
        components:
          - {ref: G, factor: 1.0}
      - name: sisma
        components:
          - {ref: Ex, factor: 1.0}

  # ----------------------------------------------------------------
  # (3) Staged with SECTION-STATE EVOLUTION (Phase 3/4).
  #     The presence of ``section_ops`` on any stage switches the
  #     engines to per-stage resistance domains, built/reused by
  #     capacity hash; a hash change resets the demand-path base.
  #
  #     section_ops keys (all optional; unknown keys raise):
  #       activate / deactivate : lists of element refs -- union
  #           index (integer position in the canonical
  #           rebars+tendons order) or element ``name``.
  #           Deactivating a stressed bonded element force-releases
  #           it: its net internal force at the carried demand is
  #           re-applied opposite-sign to the demand (equilibrium
  #           across the cut).
  #       release : bool (default true) -- false = clean removal
  #           (unstressed/hypothetical element), no released force.
  #       eps_override : {ref: eps} -- per-element locked-in strain
  #           override [-]; THE carrier for time-dependent losses
  #           (relaxation/creep/shrinkage advance eps_pe here).
  #       bulk_eps : float [-] -- PHASE-5 GUARD: non-zero RAISES
  #           (hash-effective but kernel-inert; same policy as the
  #           section-level ``prestrain``).
  #
  #     time   : cumulative days since stage 0 -> SectionState.
  #              time_days.  Informational carry-through ONLY --
  #              never hashed (losses act through eps_override).
  #              Omitted => previous stage's value carries forward.
  #              Must be non-negative and non-decreasing.
  #     report : opaque payload echoed verbatim into the per-stage
  #              result for the reporting layer.  No solver effect.
  # ----------------------------------------------------------------
  - name: costruzione_per_fasi
    stages:
      - name: fase_iniziale          # bars N1/E1 not yet installed
        components:
          - {ref: G, factor: 1.0}
        section_ops:
          deactivate: [N1, E1]       # by name (equivalently: [0, 1])
          release: false             # clean removal: never stressed
        time: 0
      - name: completamento          # bars installed, live load
        components:
          - {ref: Q1, factor: 1.0}
        section_ops:
          activate: [0, 1]           # by union index (== [N1, E1])
          # eps_override: {T_bottom: 0.0058}   # losses step (tendon)
          # bulk_eps: 0.0                      # non-zero raises (Phase 5)
        time: 28
        report: {note: "barre N1/E1 installate e inghisate"}
      - name: esercizio
        components:
          - {ref: Ex, factor: 0.3}
        time: 365                    # capacity hash unchanged => same domain

  # ----------------------------------------------------------------
  # (4) Staged with PRESTRESS ACTIONS (Step A): demand-side loads
  #     from jacking on hardened concrete / unbonded / external
  #     tendons.  An action NEVER enters the capacity hash -- it
  #     moves the demand point only:
  #       N_p = -P,  Mx = -P*(y - y_ref),  My = +P*(x - x_ref)
  #     about the section reference point (centroid).
  #
  #     Force (one of):    P [N] | P_kN [kN] | sigma_p0 [MPa] + Ap [mm2]
  #     Position (one of): x + y [mm] | ref (tendon index or name --
  #                        uses that tendon's geometry; explicit x/y
  #                        override it if also given)
  #     label: optional tag.
  # ----------------------------------------------------------------
  - name: tesatura_su_indurito
    stages:
      - name: peso_proprio
        components: [{ref: G, factor: 1.0}]
      - name: tesatura
        components: []
        prestress_actions:
          - {P_kN: 1400, x: 0, y: -420, label: cavo_esterno}
          - {sigma_p0: 1000, Ap: 1050, x: 0, y: -380}
          # - {P_kN: 1400, ref: T_bottom}   # geometry from a declared tendon


# ================================================================
#  ENVELOPES -- worst-of verification across members
# ================================================================
#  Members are refs to demands/combinations (a staged combination
#  contributes its final resultant) or inline demand points.
#  ``factor`` scales the resolved triple.

envelopes:
  - name: inviluppo_SLU
    members:
      - {ref: SLU_1}
      - {ref: SLU_sismico_Ex, factor: 1.0}
      - {ref: G, factor: 1.2}
      - {N_kN: -2500, Mx_kNm: 100, My_kNm: 50, name: punto_extra}


# ================================================================
#  OUTPUT -- flags and options
# ================================================================

output:
  # -- Utilization ratio flags --
  #
  # GenSec computes up to seven utilization metrics, in two
  # geometric families plus path-aware variants for staged loading.
  # Each answers a DIFFERENT geometric question: complementary, not
  # redundant.  eta <= 1 safe / eta > 1 unsafe; ``verified`` is
  # decided by the WORST of the enabled metrics.  Legacy ``eta_3D``
  # / ``eta_cv`` are no longer recognised (silently ignored).
  #
  # 3-D family (anisotropy-corrected normalised space):
  #   eta_norm        linear distance to the nearest boundary face
  #                   as a fraction of the Chebyshev radius D_max.
  #                   Recommended principal 3-D metric.
  #   eta_norm_beta   composite ratio F_SU/(F_SU + d_min) --
  #                   "sensitivity to perturbation"; useful for
  #                   cross-software comparison.
  #   eta_norm_ray    ray-cast from the origin: proportional load
  #                   amplification.  (Hull-based: systematically
  #                   overestimates by ~2-3% vs the exact value.)
  #
  # 2-D family ((Mx, My) plane at the demand's N; biaxial only):
  #   eta_2D          ray-cast to the Mx-My contour at fixed N.
  #
  # Path metrics (staged combinations; segment B->T from the
  # previous to the current cumulative demand).  Under section-state
  # evolution they are measured on the CURRENT stage's domain; a
  # capacity-hash change resets the path base to the carried demand.
  # A multi-stage run with NO path metric enabled emits an
  # informational warning (load history not characterised):
  #   eta_path_norm_ray    3-D ray-cast B->T
  #   eta_path_norm_beta   L/(L + d_seg) along the segment -- flags
  #                        "already at the limit before the
  #                        increment" distinctly from the ray
  #   eta_path_2D          2-D variant at cumulative N; skipped when
  #                        |dN|/N_range > delta_N_tol
  eta_norm: true               # default true
  eta_norm_beta: true          # default true
  eta_norm_ray: false          # default false
  eta_2D: false                # default false
  eta_path_norm_ray: true      # default false -- enabled: staged combos above
  eta_path_norm_beta: true     # default false
  eta_path_2D: false           # default false
  delta_N_tol: 0.03            # dN/N_range tolerance for eta_path_2D

  # -- Tiered reporting --
  verification_top_k: 10       # rows in the ranked verification tables
  fiber_details_top_k: 5       # demands selected for fiber-level detail

  # -- Domain generation --
  generate_mx_my: false        # Mx-My contour exports/plots
  generate_3d_surface: false   # 3-D (N,Mx,My) surface CSV/JSON/plot
  n_angles_mx_my: 144          # angular resolution of Mx-My contours
  n_scan_mx_my: 120            # internal scan directions per contour
  n_chi_mx_my: 14              # curvature samples per scan direction

  # -- Moment-curvature and ductility --
  generate_moment_curvature: false     # M-chi per N level (default true)
  generate_polar_ductility: false      # polar ductility plot (default true)
  generate_3d_moment_curvature: false  # 3-D M-chi-N surface (default true)

  # -- N-level strategy (for M-chi / Mx-My families) --
  # demands  -> N values appearing in the ``demands`` block
  # auto     -> linspace over [N_min, N_max] of the domain,
  #             ``n_levels_count`` levels
  # explicit -> user list ``n_levels_values`` [kN]
  n_levels_mode: demands
  # n_levels_count: 10
