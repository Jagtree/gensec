# ================================================================
#  GenSec — YAML Reference Input File
#  (full schema: v0.3.x core + prestress Phase 1 tendons +
#   Step-A prestress_actions + Phase-4 staged section_ops)
# ================================================================
#
#  This file documents EVERY supported key with inline comments.
#  It is a valid input file and can be run as-is:
#
#    uv run gensec run yaml_reference_example.yaml --output-dir results/
#    uv run gensec analyze yaml_reference_example.yaml --output-dir results/
#
#  Regenerate a plot from exported data:
#
#    uv run gensec plot results/mx_chi_N0.json
#
#  Conventions (everywhere in this file):
#    forces  N_kN   [kN]      tension positive
#    moments M*_kNm [kN*m]    right-hand rule, eps = eps0 + chix*ly - chiy*lx
#    lengths        [mm]
#    stresses       [MPa]
#    strains        [-]       tension positive
#
#  Note on runtime: the active blocks below include one staged
#  combination carrying ``section_ops``, which switches on the
#  Phase-3 staged section-state evolution (per-stage resistance
#  domains, built/reused by capacity hash).  Expect 2-3 domain
#  builds instead of 1.  Remove/disable that combination for the
#  fastest possible reference run.
#
# ================================================================


# ================================================================
#  MATERIALS
# ================================================================
#  Named material definitions.  Each key becomes the identifier
#  used in the section / rebars / tendons blocks.  ``Material.name``
#  is set to the key automatically.

materials:

  # ----------------------------------------------------------------
  # (1) Concrete, direct parameters
  #     Type: concrete_ec2_gen1_custom   (legacy alias: concrete)
  #     Full control over the constitutive parameters.
  # ----------------------------------------------------------------
  concrete_direct:
    type: concrete_ec2_gen1_custom
    fck: 49.8             # characteristic cylinder strength [MPa] (required)
    gamma_c: 1.4          # partial safety factor          (default 1.5)
    alpha_cc: 0.85        # long-term coefficient          (default 0.85)
    n_parabola: 2.0       # parabolic exponent             (default 2.0)
    eps_c2: -0.002        # peak-stress strain             (default -0.002)
    eps_cu2: -0.0035      # ultimate strain                (default -0.0035)
    # fct: 0.0            # tensile strength [MPa]         (default 0 = no tension)
    # Ec: 0.0             # tension-branch modulus [MPa]   (default 0)
    #
    # First-cracking note: the M-chi "First cracking" marker is
    # detected from a cracking strain eps_cr sourced as
    #   1) fctm/Ecm of the EC2 properties object (class-based
    #      concrete below) -- MEAN values, the correct model for the
    #      serviceability cracking event, independent of whether the
    #      design law models tension;
    #   2) otherwise fct/Ec declared here (eps_ct), if positive;
    #   3) otherwise no cracking info -> no marker (honest None).

  # ----------------------------------------------------------------
  # (2) Concrete, EC2/NTC class-based
  #     Type: concrete_ec2_gen1   (legacy alias: concrete_ec2)
  #     All code-prescribed parameters (fck, fcm, fctm, Ecm, ...)
  #     derived from EC2 Table 3.1 via the fben2 bridge.
  #     Give EITHER ``class`` OR ``fck``.
  # ----------------------------------------------------------------
  C25:
    type: concrete_ec2_gen1
    class: C25/30          # strength class (alternative: fck: 25)
    ls: F                  # limit state / loading regime   (default F)
    loadtype: slow         # slow / fast loading            (default slow)
    TypeConc: R            # cement class R / N / S         (default R)
    NA: French             # National Annex                 (default French)
    time: 28               # concrete age [days]            (default 28)
    enable_tension: false  # tension branch in the DESIGN constitutive
                           # law (default false).  Independent of the
                           # first-cracking marker, which always uses
                           # the mean fctm/Ecm of this class.
    # tension_fct: fctd    # which fct the tension branch uses (default fctd)

  # ----------------------------------------------------------------
  # (3) Reinforcing steel
  # ----------------------------------------------------------------
  B450C:
    type: steel
    fyk: 450.0             # characteristic yield strength [MPa] (required)
    gamma_s: 1.15          # partial safety factor          (default 1.15)
    Es: 200000             # Young's modulus [MPa]          (default 200000)
    k_hardening: 1.0       # ft/fy ratio; 1.0 = elastic-perfectly-plastic
    eps_su: 0.075          # ultimate strain                (default 0.01)
    works_in_compression: true   # false for FRP / tension-only materials

  # ----------------------------------------------------------------
  # (4) Prestressing steel, EC2 sect. 3.3
  #     Type: prestressing_steel_ec2
  #     Give EITHER a standard designation ``class`` (e.g. Y1860S7)
  #     OR all of f_p01k / f_pk / eps_uk.
  #     Used by the ``tendons`` block (bonded prestress elements).
  # ----------------------------------------------------------------
  Y1860:
    type: prestressing_steel_ec2
    class: Y1860S7         # designation (alt.: f_p01k/f_pk/eps_uk explicit)
    # f_p01k: 1674         # 0.1% proof stress [MPa]    | explicit
    # f_pk: 1860           # tensile strength [MPa]     | alternative
    # eps_uk: 0.035        # char. ultimate strain [-]  | to ``class``
    # Ep: 195000           # modulus [MPa] (default 195000; explicit form only)
    ls: F                  # limit state                    (default F)
    NA: EC2                # National Annex                 (default EC2)
    eps_ud_factor: 0.9     # eps_ud = factor * eps_uk       (default 0.9)
    # gamma_s_override: 1.15   # force gamma_s instead of the LS/NA-derived one
    diagram: horizontal    # 'horizontal' or 'inclined' post-yield branch
    works_in_compression: true

  # ----------------------------------------------------------------
  # (5) Tabulated material -- any piecewise-linear sigma-eps curve.
  #     Strain outside the tabulated range => sigma = 0.
  # ----------------------------------------------------------------
  # cfrp_sheet:
  #   type: tabulated
  #   name: CFRP_200GPa
  #   strains:  [0.0, 0.017]
  #   stresses: [0.0, 2800.0]


# ================================================================
#  SECTION
# ================================================================
#  Two formats:
#
#  (a) LEGACY RECTANGULAR -- ``B`` + ``H`` (no ``shape`` key):
#
#        section:
#          B: 300                # width  [mm]
#          H: 600                # depth  [mm]
#          bulk_material: C25
#          n_fibers_y: 100       # mesh rows along H (alias: n_fibers)
#          n_fibers_x: 1         # 1 => isotropic grid; >1 => explicit biaxial
#          rebars: [...]
#          tendons: [...]
#
#  (b) GENERIC -- ``shape`` + ``params`` (this file).  Shapes and
#      their params:
#        rect         B, H
#        circle       D, resolution (default 64)
#        annulus      D_ext, D_int, resolution
#        tee          bf, hf, bw, hw
#        inv_tee      bf, hf, bw, hw
#        h            bf, hf_top, hf_bot, bw, hw
#        box          B, H, tw, tf_top, tf_bot (optional)
#        single_tee   b_top, h_top, bw, hw
#        double_tee   b_top, h_top, bw, hw, stem_spacing
#        custom       exterior (vertex list), holes (list of rings)

section:

  shape: custom
  params:
    exterior:              # octagonal column, vertices CCW [mm]
      - [95, 505]
      - [-95, 505]
      - [-505, 95]
      - [-505, -95]
      - [-95, -505]
      - [95, -505]
      - [505, -95]
      - [505, 95]
    # holes:               # optional list of interior rings
    #   - [[-100,-100], [100,-100], [100,100], [-100,100]]

  bulk_material: concrete_direct
  mesh_size: 15            # target fiber edge length [mm]
  mesh_method: grid        # 'grid' (default) or 'triangle'

  # --- Optional multi-material zones --------------------------------
  # Polygonal sub-zones overriding the bulk material inside them
  # (e.g. a jacketing layer, a higher-class core).  Same shape
  # grammar as the section itself.
  # material_zones:
  #   - shape: rect
  #     params: {B: 400, H: 400}
  #     material: C25

  # --- Bulk pre-strain (resistance side) -----------------------------
  # Uniform locked-in bulk strain [-] (shrinkage/thermal), tension
  # positive.  Canonical key ``prestrain`` (alias ``eps_init``).
  # PHASE-5 GUARD: the field is parsed, hashed and propagated, but
  # the fiber kernel does not consume it yet -- a NON-ZERO value
  # RAISES (no-silent-no-op) until the kernel change lands.
  # prestrain: 0.0

  # --- Rebars ---------------------------------------------------------
  # Each layer needs: y, material, and EITHER As OR diameter.
  #   As [mm2] takes precedence; otherwise As = n_bars * pi/4 * d^2.
  #   x [mm] is required for biaxial sections.
  #   embedded: true (default) subtracts the displaced bulk at the
  #             fiber (net contribution [sig_s(eps) - sig_bulk(eps)]*As);
  #             set false for external elements (FRP, truss chords).
  #   name:     optional stable identifier; referenceable from a
  #             stage's ``section_ops`` (activate/deactivate/
  #             eps_override) instead of the union index.  Names
  #             must be unique across the rebars+tendons union set.
  rebars:
    - {y: 445,    x: 70.1,   diameter: 30, material: B450C, name: N1}
    - {y: 70.1,   x: 445,    diameter: 30, material: B450C, name: E1}
    - {y: 331.2,  x: 176.4,  diameter: 26, material: B450C}
    - {y: 186.8,  x: 328.3,  diameter: 26, material: B450C}
    - {y: 186.8,  x: -328.3, diameter: 26, material: B450C}
    - {y: 331.2,  x: -176.4, diameter: 26, material: B450C}
    - {y: 70.1,   x: -445,   diameter: 30, material: B450C}
    - {y: 445,    x: -70.1,  diameter: 30, material: B450C}
    - {y: -445,   x: -70.1,  diameter: 30, material: B450C}
    - {y: -70.1,  x: -445,   diameter: 30, material: B450C}
    - {y: -331.2, x: -176.4, diameter: 26, material: B450C}
    - {y: -186.8, x: -328.3, diameter: 26, material: B450C}
    - {y: -186.8, x: 328.3,  diameter: 26, material: B450C}
    - {y: -331.2, x: 176.4,  diameter: 26, material: B450C}
    - {y: -70.1,  x: 445,    diameter: 30, material: B450C}
    - {y: -445,   x: 70.1,   diameter: 30, material: B450C}
    # n_bars demo: 3 phi 16 lumped in one layer (As computed):
    # - {y: 0, x: 0, diameter: 16, n_bars: 3, material: B450C}

  # --- Tendons (BONDED prestress elements, Phase 1) -------------------
  # A Tendon is a strain-compatible section element: it enters the
  # RESISTANCE domain (and the capacity hash) through its effective
  # prestrain eps_pe.  Element taxonomy:
  #   bonded tendon            -> ``tendons`` entry here;
  #   unbonded / external /    -> NOT an element: a demand-side LOAD,
  #   jacking on hardened conc.   modelled as ``prestress_actions``
  #                               on a stage (see combinations).
  # ``bonded: false`` is therefore rejected by construction.
  #
  # Area: Ap [mm2] directly, or Ap = n_strands * area_strand.
  # eps_pe [-]: effective prestrain referenced to the
  #   unstrained-concrete (casting) state, tension positive -- the
  #   jacking strain sigma_p0/Ep for pre-tensioning.  The immediate
  #   elastic-shortening loss is NOT stored here: it emerges from
  #   section equilibrium (see solver/prestress_transfer.py).
  # system: 'pre'/'post' -- stored only, no behavioural effect.
  # name:   optional; referenceable both from ``prestress_actions``
  #         (ref -> tendon geometry) and from ``section_ops``.
  #
  # tendons:
  #   - y: -420
  #     x: 0
  #     material: Y1860
  #     n_strands: 7
  #     area_strand: 150      # => Ap = 1050 mm2
  #     eps_pe: 0.00715       # ~= 1395 MPa / 195000 MPa
  #     system: pre
  #     bonded: true          # (default; false raises by design)
  #     embedded: true
  #     name: T_bottom


# ================================================================
#  DEMANDS -- individual load cases
# ================================================================
#  Units: N_kN [kN], Mx_kNm / My_kNm [kN*m].
#  N > 0 = tension; moments per right-hand rule.
#  Legacy key ``M_kNm`` == Mx only (My = 0).

demands:
  - {name: G,  N_kN: -2771.69, Mx_kNm: 110.48, My_kNm: 161.42}
