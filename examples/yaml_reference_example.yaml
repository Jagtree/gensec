# ================================================================
#  GenSec v0.3.0 — YAML Reference Input File
# ================================================================
#
#  This file documents every supported key with inline comments.
#  It is a valid input file and can be run as-is.
#
#  Usage:
#    uv run gensec run yaml_reference_example.yaml --output-dir results/
#
#  Regenerate a plot from exported data:
#    uv run gensec plot results/mx_chi_N0.json
#
# ================================================================


# ================================================================
#  MATERIALS
# ================================================================
#  Named material definitions.  Each key becomes the identifier
#  used in the section block.

materials:

  # --- Concrete: direct parameters ---
  # Use when full control over the constitutive parameters is needed.
  # Type: ``concrete_ec2_gen1_custom``  (legacy alias: ``concrete``)
  concrete_direct:
    type: concrete_ec2_gen1_custom
    fck: 49.8             # characteristic cylinder strength [MPa] (required)
    gamma_c: 1.4          # partial safety factor (default 1.5)
    alpha_cc: 0.85        # long-term coefficient (default 0.85)
    n_parabola: 2.0       # parabolic exponent (default 2.0)
    eps_c2: -0.002        # peak-stress strain (default -0.002)
    eps_cu2: -0.0035      # ultimate strain (default -0.0035)
    # fct: 0.0            # tensile strength [MPa] (default 0 = no tension)
    # Ec: 0.0             # elastic modulus [MPa] for tension (default 0)

  # --- Concrete: EC2/NTC class-based ---
  # Alternative, EC2-bridged form (``type: concrete_ec2_gen1`` with
  # a strength ``class``).  All time-dependent and code-prescribed
  # parameters (fck, fcm, fctm, Ecm, etc.) are derived from EC2
  # Table 3.1.  Sample:
  #
  #   C25:
  #     type: concrete_ec2_gen1
  #     class: C25/30
  #     ls: F            # long/short loading regime
  #     loadtype: slow   # slow/fast loading
  #     TypeConc: R      # cement class (R/N/S)
  #     NA: French       # National Annex
  #     time: 28         # concrete age [days]

  # --- Reinforcing steel ---
  B450C:
    type: steel
    fyk: 450.0             # characteristic yield strength [MPa] (required)
    gamma_s: 1.15          # partial safety factor (default 1.15)
    Es: 200000             # Young's modulus [MPa] (default 200000)
    k_hardening: 1.0       # ft/fy ratio; 1.0 = perfectly plastic (default 1.0)
    eps_su: 0.075          # ultimate strain (default 0.01)
    works_in_compression: true  # set false for FRP or tension-only materials

  # --- Tabulated material (any sigma-epsilon curve) ---
  # Piecewise-linear.  Strain outside the range => sigma = 0.
  # cfrp_sheet:
  #   type: tabulated
  #   name: CFRP_200GPa
  #   strains:  [0.0, 0.017]
  #   stresses: [0.0, 2800.0]


# ================================================================
#  SECTION
# ================================================================
#  Two formats supported: legacy rectangular (``B`` + ``H``) or
#  generic (``shape`` + ``params``).
#
#  Legacy rectangular:
#    ``n_fibers_y`` controls the mesh resolution along H.  When
#    ``n_fibers_x`` is omitted or set to 1, an isotropic grid is
#    used (same cell size in both directions).  Set
#    ``n_fibers_x > 1`` for explicit control.

section:

  # --- Generic format ---
  shape: custom            # rect, circle, annulus, tee, inv_tee, h,
                           # box, single_tee, double_tee, custom
  params:
    exterior:
      - [95, 505]
      - [-95, 505]
      - [-505, 95]
      - [-505, -95]
      - [-95, -505]
      - [95, -505]
      - [505, -95]
      - [505, 95]
  bulk_material: concrete_direct
  mesh_size: 15            # target fiber edge length [mm]
  mesh_method: grid        # 'grid' (default) or 'triangle'

  rebars:
    # Each rebar needs: y, material, and EITHER As OR diameter.
    # If both As and diameter are given, As takes precedence.
    # If only diameter is given, As = n_bars * pi/4 * d^2
    # (n_bars defaults to 1).
    # x is required for biaxial sections.
    - {y: 445,    x: 70.1,   diameter: 30, material: B450C}
    - {y: 70.1,   x: 445,    diameter: 30, material: B450C}
    - {y: 331.2,  x: 176.4,  diameter: 26, material: B450C}
    - {y: 186.8,  x: 328.3,  diameter: 26, material: B450C}
    - {y: 186.8,  x: -328.3, diameter: 26, material: B450C}
    - {y: 331.2,  x: -176.4, diameter: 26, material: B450C}
    - {y: 70.1,   x: -445,   diameter: 30, material: B450C}
    - {y: 445,    x: -70.1,  diameter: 30, material: B450C}
    - {y: -445,   x: -70.1,  diameter: 30, material: B450C}
    - {y: -70.1,  x: -445,   diameter: 30, material: B450C}
    - {y: -331.2, x: -176.4, diameter: 26, material: B450C}
    - {y: -186.8, x: -328.3, diameter: 26, material: B450C}
    - {y: -186.8, x: 328.3,  diameter: 26, material: B450C}
    - {y: -331.2, x: 176.4,  diameter: 26, material: B450C}
    - {y: -70.1,  x: 445,    diameter: 30, material: B450C}
    - {y: -445,   x: 70.1,   diameter: 30, material: B450C}


