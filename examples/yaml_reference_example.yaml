# ================================================================
#  OUTPUT — flags and options (v0.3.0)
# ================================================================

output:
  # ── Utilization ratio flags ──
  #
  # v0.3.0 redesigns the metric architecture.  GenSec computes up
  # to seven utilization metrics, organised in two geometric
  # families plus path-aware variants for staged loading.  Each
  # metric answers a different geometric question: they are
  # complementary, not redundant.  All share the convention
  # η ≤ 1 safe / η > 1 unsafe; pass/fail (``verified``) is decided
  # by the worst of the enabled metrics.
  #
  # The legacy ``eta_3D`` and ``eta_cv`` flags are no longer
  # recognised and are silently ignored.
  #
  # ── 3-D family ──
  #
  # Operates in anisotropy-corrected normalised space (axial axis
  # rescaled by u_x = ΔMx/ΔN, My axis by v_y = ΔMx/ΔMy, so the
  # domain bounding box has the same numeric extent on every axis).
  # Euclidean distances are physically meaningful even for strongly
  # anisotropic sections (walls, slabs, T-beams).
  #
  #   eta_norm        Linear distance from the demand to the
  #                   nearest boundary face, expressed as a
  #                   fraction of the Chebyshev radius D_max:
  #                     η = 1 - d_min / D_max  (interior)
  #                     η = 1 + d_min / D_max  (exterior)
  #                   A true geometric distance.  Reaches 0 at the
  #                   Chebyshev centre, 1 on the boundary.
  #                   *Recommended principal 3-D metric.*
  #
  #   eta_norm_beta   Composite ratio  F_SU / (F_SU + d_min).
  #                   Mixes the demand norm and the face-distance.
  #                   Not a pure distance: depends on position
  #                   relative to the coordinate origin.  Reads as
  #                   "sensitivity to perturbation in proportion to
  #                   the demand magnitude".  Useful for
  #                   cross-software validation since equivalent
  #                   formulations are reported by some commercial
  #                   RC software.
  #
  #   eta_norm_ray    Ray-cast from the origin in normalised space:
  #                     η = |S_u| / |R_u|.
  #                   Answers "if I scale all three force
  #                   components proportionally, when does the
  #                   demand exit the domain?".  Linear in demand
  #                   magnitude along any fixed ray.
  #
  # ── 2-D family ──
  #
  # Operates in the (Mx, My) plane at the demand's N.  Both axes
  # share physical units, no normalisation needed.
  #
  #   eta_2D          Ray-cast from the origin in the (Mx, My)
  #                   plane to the contour at the demand's N.
  #                   Useful for fixed-N flexural verifications.
  #                   Requires a biaxial section.
  #
  # ── Path metrics ──
  #
  # For staged combinations only.  Defined on the segment B→T from
  # the previous-stage cumulative demand B to the current-stage
  # cumulative demand T.  When a multi-stage combination is
  # processed without ANY path metric enabled, GenSec emits an
  # informational warning (the report would only contain point
  # metrics at each cumulative state, without characterising the
  # load history).
  #
  #   eta_path_norm_ray   3-D ray-cast in normalised space, B→T.
  #                       Path-direction-aware analogue of
  #                       eta_norm_ray.  Stored under the same key
  #                       in the CSV/JSON output.
  #
  #   eta_path_norm_beta  Composite ratio L / (L + d_seg) along
  #                       the stage segment, with L = |T - B| and
  #                       d_seg the minimum signed distance of the
  #                       segment from the boundary.  Path analogue
  #                       of eta_norm_beta.  Particularly
  #                       informative in seismic verification with
  #                       staged gravity: flags "structure already
  #                       at the limit before the increment"
  #                       distinctly from eta_path_norm_ray.
  #
  #   eta_path_2D         2-D variant on the Mx-My contour at
  #                       cumulative N.  Skipped if the axial-force
  #                       change between stages exceeds
  #                       ``delta_N_tol``.
  eta_norm: true               # default: true  — principal 3-D linear distance
  eta_norm_beta: true          # default: true  — composite ratio (cross-software comparison)
  eta_norm_ray: false          # default: false — proportional load amplification
  eta_2D: false                # default: false — Mx-My ray-cast (biaxial only)
  eta_path_norm_ray: false     # default: false — staged 3-D ray
  eta_path_norm_beta: false    # default: false — staged composite ratio (informative under seismic + gravity)
  eta_path_2D: false           # default: false — staged Mx-My ray
  delta_N_tol: 0.03            # tolerance on ΔN/N_range for eta_path_2D

  # ── Domain generation ──
  generate_mx_my: false        # Mx-My contour plots (default: false)
  generate_3d_surface: false   # 3D surface CSV/JSON/plot (default: false)
  n_angles_mx_my: 144          # angular resolution for Mx-My (default: 144)

  # ── Moment-curvature and ductility ──
  generate_moment_curvature: false     # M-χ diagrams per N level (default: true)
  generate_polar_ductility: false      # polar ductility plot (default: true)
  generate_3d_moment_curvature: false  # 3D M-χ-N surface (default: true)

  # ── N-level strategy ──
  # "demands" → use the N-values appearing in the ``demands`` block.
  # "auto"    → linspace between N_min and N_max of the resistance
  #             domain, ``n_levels_count`` levels.
  # "explicit"→ user-supplied list ``n_levels_values``.
  n_levels_mode: demands
  # n_levels_count: 10
  # n_levels_values: [-3000, -1500, 0]
