# =====================================================================
#  GenSec — flagship for Phase 5 / C5: time-dependent losses on a
#  PRESTRESSED COMPOSITE section.
#
#  A post-tensioned precast beam (cast, cured, stressed, grouted) that
#  is left to creep for two months, then receives a topping and creeps
#  on to 70 years.  It is the case EN 1992-1-1 (5.46) *cannot* express:
#  two concrete zones of different age, different creep and different
#  shrinkage, restraining each other.
# =====================================================================

# ---------------------------------------------------------------------
#  Document schema version (D7).  Mandatory for any document that
#  declares 'zone_rheology', 'tolerances' or a provider 'declared:'
#  block: those carry hand-written, time-dependent or judgement
#  numbers that travel into the machine-readable timeline dump as
#  provenance, and provenance under an unstated contract is not
#  provenance.  See handoff/13_0-GENSEC_DUMP_SCHEMA.md section 1.1.
# ---------------------------------------------------------------------
# The model's normative declaration. GenSec derives nothing without
# it: f_ck is an input, the code is what turns it into a modulus, and
# the two disagree by 33.9 % at C25. Declared once here; a material
# may override it with its own 'code:', and 'code: custom' means the
# input supplies every code-dependent value itself.
code: ec2

schema_version: 1

materials:
  c_precast:
    type: concrete
    fck: 45.0
    gamma_c: 1.5
    # EN 1992-1-1 §3.1.6(1)P recommended value, declared
    # here because the container supplies none.
    long_term_reduction_factor: 0.85
  c_topping:
    type: concrete
    fck: 30.0
    gamma_c: 1.5
    # EN 1992-1-1 §3.1.6(1)P recommended value, declared
    # here because the container supplies none.
    long_term_reduction_factor: 0.85
  steel:
    type: steel
    fyk: 450.0
    gamma_s: 1.15
  strand:
    type: prestressing_steel_ec2
    class: Y1860S7          # f_p01k=1600, f_pk=1860, eps_uk=0.035, Ep=195000
    ls: F
    diagram: inclined

    NA: "EC2"
    eps_ud_factor: 0.9
section:
  shape: rect
  params: {B: 600, H: 1400}
  bulk_material: c_precast
  mesh_size: 50
  material_zones:
    - shape: custom
      name: topping
      material: c_topping
      params:
        exterior: [[0, 1200], [600, 1200], [600, 1400], [0, 1400]]
  rebars:
    - {name: A1, x: 60,  y: 60,   diameter: 26, material: steel}
    - {name: A2, x: 540, y: 60,   diameter: 26, material: steel}
    - {name: T1, x: 60,  y: 1340, diameter: 16, material: steel}
    - {name: T2, x: 540, y: 1340, diameter: 16, material: steel}
  tendons:
    - name: P1
      x: 300
      y: 150
      Ap: 2000.0
      material: strand
      eps_pe: 0.0          # set by the timeline's stress/grout events
      bonded: true

# ---------------------------------------------------------------------
#  The rheology.  Nothing here is mechanics: every key is either the
#  norm's own (fck, cement class, RH) or the container's own (chi, the
#  relaxation reduction).  Swap `provider: ec2` for `provider: aci` and
#  the container does not move.
# ---------------------------------------------------------------------
losses_models:
  rheo_precast:
    provider: ec2
    fck: 45.0
    cement_class: R          # rapid-hardening: a precast yard
    RH: 70.0
    chi: lump                # 0.8 — EN 1992-1-1 (5.46).  'from_J' computes it.
    relaxation_reduction: 0.8
  rheo_topping:
    provider: ec2
    fck: 30.0
    cement_class: N
    RH: 70.0
    chi: lump
    # The topping is loaded at one day.  EN 1992-1-1 §3.1.2(5) states
    # f_ck(t) -- and therefore §3.1.4(4)'s 0.45 f_ck(t) -- only from
    # three days, so the provider refuses below that rather than return
    # a zero that any compression would cross.  The floor below is the
    # engineer's, declared with its provenance, not the Eurocode's.
    # It is small enough to still catch a real violation: the F4
    # symptom this example exists to exercise reaches 2.26 MPa.
    declared:
      linearity_limit:
        value:  1.0
        domain: [0.0, 3.0]
        source: >
          Project engineering judgement, outside the validity range of
          EN 1992-1-1 §3.1.2(5).  Chosen so that a freshly cast, nearly
          stress-free zone does not trip a guard whose reference
          quantity the code does not define at that age.

# ---------------------------------------------------------------------
#  The rheological identity of each zone, declared once (P3).  An age is
#  a property of the zone, not of an interval: declaring it inside
#  ``interval.losses`` left every earlier event -- the grout above all --
#  with no age to evaluate E_c(t) at, and the stopgap filled the hole
#  with a silent 28-day default.  Here the base is 28 d when the
#  timeline starts, and the topping is 1 d when it is cast (the props
#  go in a day later, which is what the 3-day interval below measures).
#  The intervals keep naming their models; the two declarations are
#  enforced to agree.
# ---------------------------------------------------------------------
zone_rheology:
  base:    {model: rheo_precast, age: 28, curing: 3}
  topping: {model: rheo_topping, age: 3,  curing: 1}

demands:
  - {name: G1, N_kN: -300, Mx_kNm: -220}   # precast self-weight
  - {name: G2, Mx_kNm: -180}               # topping + superimposed dead
  - {name: Q,  Mx_kNm: -260}               # variable

construction_history:
  - load:     {demand: G1}                          # precast on its bearings
  - stress:   {tendons: [P1], sigma_p0: 1300.0}     # jacking
  - grout:    {tendons: [P1]}                       # bonded from here on
  - point:    transfer
  - interval:                                       # 28 d -> 90 d, precast alone
      days: 62
      losses:
        base: {model: rheo_precast, age: 28, curing: 3}
  - cast:     {zone: topping, datum: auto}          # topping cast at 90 d
  - interval:                                       # props in: the topping cures
      days: 3                                       #   and already shrinks --
      losses:                                       #   restrained by the precast
        base:    {model: rheo_precast}              # age DERIVED: 28 + 62 = 90 d
        topping: {model: rheo_topping, age: 3, curing: 1}
  - load:     {demand: G2}                          # props struck at 4 d
  - point:    composite
  - interval:                                       # -> 70 years
      days: 25457
      losses:
        base:    {model: rheo_precast}              # DERIVED: 93 d
        topping: {model: rheo_topping}              # DERIVED:  4 d
  - point:    service

combinations:
  - name: ULS_composite
    at: [transfer, composite, service]
    history_factors: {G1: 1.35, G2: 1.35}
    gamma_P: favourable
    components:
      - {ref: Q, factor: 1.5}
  - name: SLS_char
    at: service
    history_factors: {G1: 1.0, G2: 1.0}
    components:
      - {ref: Q, factor: 1.0}

output:
  verification_top_k: 10
