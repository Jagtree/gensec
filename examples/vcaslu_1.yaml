# ================================================================
#  GenSec v0.3.0 — VCASLU validation case (300x500 rect)
# ================================================================
#
#  Single demand at low compression with significant biaxial moment.
#  Used for cross-software comparison against VCASLU.
# ================================================================

materials:
  C25:
    type: concrete_ec2_gen1
    class: C25/30
    ls: F
    loadtype: slow
    TypeConc: R

  B450C:
    type: steel
    fyk: 450.0
    gamma_s: 1.15
    works_in_compression: true

section:
  B: 300
  H: 500
  bulk_material: C25
  n_fibers_y: 40
  n_fibers_x: 20
  rebars:
    - {x: 30,  y: 30,  As: 201.06, material: B450C, n_bars: 1, diameter: 8}
    - {x: 30,  y: 250, As: 201.06, material: B450C, n_bars: 1, diameter: 8}
    - {x: 30,  y: 470, As: 201.06, material: B450C, n_bars: 1, diameter: 8}
    - {x: 270, y: 30,  As: 201.06, material: B450C, n_bars: 1, diameter: 8}
    - {x: 270, y: 250, As: 201.06, material: B450C, n_bars: 1, diameter: 8}
    - {x: 270, y: 470, As: 201.06, material: B450C, n_bars: 1, diameter: 8}

demands:
  - name: Test_1
    N_kN: -10
    Mx_kNm: -65
    My_kNm: 30

output:
  # v0.3.0 utilization flags.
  eta_norm: true               # principal 3-D linear-distance metric
  eta_norm_beta: true          # composite ratio (cross-software comparison)
  eta_2D: true                 # Mx-My ray at fixed N (biaxial only)
  generate_mx_my: true
  generate_3d_surface: true
  n_angles_mx_my: 144
  generate_moment_curvature: false
  generate_polar_ductility: false
  generate_3d_moment_curvature: false
