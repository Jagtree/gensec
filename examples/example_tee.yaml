# ================================================================
#  GenSec v0.3.0 — T-section example (generic format)
# ================================================================
#
#  Parametric T-shape via the ``tee`` primitive.  Origin at the
#  bottom-left of the bounding box; bf = top flange width,
#  bw = web width.
# ================================================================

# The model's normative declaration. GenSec derives nothing without
# it: f_ck is an input, the code is what turns it into a modulus, and
# the two disagree by 33.9 % at C25. Declared once here; a material
# may override it with its own 'code:', and 'code: custom' means the
# input supplies every code-dependent value itself.
code: ec2

materials:
  concrete_1:
    type: concrete_ec2_gen1
    class: C25/30

    ls: "F"
    loadtype: "slow"
    TypeConc: "R"
    NA: "French"
    time: 28
  steel_1:
    type: steel
    fyk: 450.0
    gamma_s: 1.15
    Es: 200000
    k_hardening: 1.0
    eps_su: 0.01
    works_in_compression: true

section:
  shape: tee
  params:
    bf: 800
    hf: 150
    bw: 300
    hw: 450
  bulk_material: concrete_1
  mesh_size: 15
  mesh_method: grid
  rebars:
    - {y: 40,  x: 310, As: 314.16, material: steel_1, n_bars: 2, diameter: 20}
    - {y: 40,  x: 490, As: 314.16, material: steel_1, n_bars: 2, diameter: 20}
    - {y: 560, x: 250, As: 628.32, material: steel_1, n_bars: 4, diameter: 20}
    - {y: 560, x: 550, As: 628.32, material: steel_1, n_bars: 4, diameter: 20}

demands:
  - name: Gravity
    N_kN: -500
    Mx_kNm: 350
    My_kNm: 0
  - name: Seismic
    N_kN: -200
    Mx_kNm: 500
    My_kNm: 0

output:
  # v0.3.0 utilization flags (the two 3-D defaults).
  eta_norm: true
  eta_norm_beta: true
  generate_mx_my: true
  generate_3d_surface: true
  n_angles_mx_my: 144
  generate_moment_curvature: false
  generate_polar_ductility: false
  generate_3d_moment_curvature: false
