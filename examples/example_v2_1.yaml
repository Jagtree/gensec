# ================================================================
#  GenSec v0.3.0 — full pipeline: demands + combinations + envelopes
# ================================================================
#
#  Exercises every demand container introduced in the v2.1 spec:
#    - base ``demands`` (individual load cases),
#    - simple factored ``combinations`` (sum of ``components``),
#    - staged ``combinations`` (sequential ``stages``),
#    - ``envelopes`` over both refs and inline points.
#
#  Path-aware metrics (``eta_path_*``) are enabled to characterise
#  the staged combinations; without them GenSec would emit a stderr
#  warning when processing any multi-stage combination.
# ================================================================

materials:
  C25:
    type: concrete_ec2_gen1
    class: C25/30
    ls: F
    loadtype: slow
    TypeConc: R

  B450C:
    type: steel
    fyk: 450.0
    gamma_s: 1.15
    works_in_compression: true

section:
  B: 300
  H: 500
  bulk_material: C25
  n_fibers_y: 40
  n_fibers_x: 20
  rebars:
    - {x: 30,  y: 30,  As: 201.06, material: B450C, n_bars: 1, diameter: 8}
    - {x: 30,  y: 250, As: 201.06, material: B450C, n_bars: 1, diameter: 8}
    - {x: 30,  y: 470, As: 201.06, material: B450C, n_bars: 1, diameter: 8}
    - {x: 270, y: 30,  As: 201.06, material: B450C, n_bars: 1, diameter: 8}
    - {x: 270, y: 250, As: 201.06, material: B450C, n_bars: 1, diameter: 8}
    - {x: 270, y: 470, As: 201.06, material: B450C, n_bars: 1, diameter: 8}

# ── Base demands (individual load cases) ──
demands:
  - name: G
    N_kN: -500
    Mx_kNm: 20
    My_kNm: 5

  - name: Q1
    N_kN: -100
    Mx_kNm: 40
    My_kNm: 10

  - name: Ex
    N_kN: 50
    Mx_kNm: 80
    My_kNm: 60

  - name: Ey
    N_kN: 20
    Mx_kNm: 30
    My_kNm: 90

# ── Combinations ──
combinations:
  # Simple: factored sum, no stages.
  - name: SLU_1
    components:
      - {ref: G,  factor: 1.3}
      - {ref: Q1, factor: 1.5}

  # Staged: gravity base + seismic increment along Ex.
  - name: SLU_sismico_Ex
    stages:
      - name: gravitazionale
        components:
          - {ref: G,  factor: 1.0}
          - {ref: Q1, factor: 0.3}
      - name: sisma
        components:
          - {ref: Ex, factor: 1.0}

  # Staged: gravity + seismic Ey.
  - name: SLU_sismico_Ey
    stages:
      - name: gravitazionale
        components:
          - {ref: G,  factor: 1.0}
          - {ref: Q1, factor: 0.3}
      - name: sisma
        components:
          - {ref: Ey, factor: 1.0}

# ── Envelopes ──
envelopes:
  # Envelope of combinations.
  - name: Envelope_SLU
    members:
      - {ref: SLU_1}
      - {ref: SLU_sismico_Ex}
      - {ref: SLU_sismico_Ey}

  # Envelope mixing refs and inline demand points.
  - name: Envelope_diretto
    members:
      - {ref: G}
      - {N_kN: -800, Mx_kNm: 60, My_kNm: 25}
      - {N_kN: -300, Mx_kNm: 90, My_kNm: 40}

# ── Output flags (v0.3.0) ──
output:
  # 3-D family (anisotropy-corrected normalised space).
  eta_norm: true               # default: true  — principal linear-distance metric
  eta_norm_beta: true          # default: true  — composite ratio (cross-software comparison)
  eta_norm_ray: true           # default: false — proportional load amplification

  # 2-D family (Mx-My plane at the demand's N).
  eta_2D: true                 # default: false — biaxial only

  # Path metrics (staged combinations).  At least one must be ON
  # to silence the staged-combination warning.
  eta_path_norm_ray: true      # default: false — staged 3-D ray-cast
  eta_path_norm_beta: true     # default: false — staged composite ratio (informative under seismic + gravity)
  eta_path_2D: true            # default: false — staged Mx-My ray
  delta_N_tol: 0.03            # tolerance on ΔN/N_range for eta_path_2D

  # Domain generation.
  generate_mx_my: true
  generate_3d_surface: true
  n_angles_mx_my: 144
  generate_moment_curvature: false
  generate_polar_ductility: false
  generate_3d_moment_curvature: false
